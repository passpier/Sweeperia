    <style>
      /* Paints before the JS bundle: keeps the screen from sitting blank while the renderer boots or a board builds. */
      #boot { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #1b1710; color: #e9c46a; font: 700 22px/1 Georgia, serif; letter-spacing: 6px; }
      #boot.hide { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
      #boot span { animation: bootpulse 1s ease-in-out infinite; }
      @keyframes bootpulse { 50% { opacity: 0.35; } }
    </style>
